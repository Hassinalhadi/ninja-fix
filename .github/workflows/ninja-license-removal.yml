name: Remove Custom License UI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  remove-custom-license:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Download Apktool
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar" \
            -o apktool.jar

          java -version
          java -jar apktool.jar --version

      - name: Download APK Signer
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar" \
            -o uber-apk-signer.jar

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="ninja.apk"

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: ninja.apk was not found in main branch."
            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

          sha256sum "$APK_FILE" | tee original-apk-sha256.txt

          ls -lh "$APK_FILE"

      - name: Decode APK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf apk_source

          java -jar apktool.jar d \
            "$APK_FILE" \
            -o apk_source \
            -f \
            -r

      - name: Patch Custom License Components
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p analysis

          find_class() {
            local class_name="$1"

            find apk_source \
              -type f \
              -path "*/smali*/${class_name}.smali" \
              | head -n 1
          }

          write_smoooth_application() {
            local target="$1"

            cat > "$target" <<'EOF'
          .class public Lcom/SecurityGuardBrige/ArchersSmoothLoginers/SmooothApplicationMougraph;
          .super Ljava/lang/Object;
          .source "SmooothApplicationMougraph.java"
          
          .method public constructor <init>()V
              .registers 1
              invoke-direct {p0}, Ljava/lang/Object;-><init>()V
              return-void
          .end method
          
          .method public static dismissLoginForTrial()V
              .registers 0
              return-void
          .end method
          
          .method public static reactContent(Landroid/app/Activity;)V
              .registers 1
              return-void
          .end method
          EOF
          }

          write_feature_guard() {
            local target="$1"

            cat > "$target" <<'EOF'
          .class public final Lcom/SecurityGuardBrige/ArchersSmoothLoginers/FeatureAccessGuard;
          .super Ljava/lang/Object;
          .source "FeatureAccessGuard.java"
          
          .field public static final FEATURE_ARCHERS:I = 0x51
          .field public static final FEATURE_PANEL:I = 0xa7
          
          .method private constructor <init>()V
              .registers 1
              invoke-direct {p0}, Ljava/lang/Object;-><init>()V
              return-void
          .end method
          
          .method public static activateTrial(Landroid/app/Activity;)Z
              .registers 1
              const/4 v0, 0x1
              return v0
          .end method
          
          .method public static authorizeFeature(Landroid/app/Activity;I)Z
              .registers 2
              const/4 v0, 0x1
              return v0
          .end method
          
          .method public static beginVerification(Landroid/app/Activity;)V
              .registers 1
              return-void
          .end method
          
          .method public static completeCallback()V
              .registers 0
              return-void
          .end method
          
          .method public static confirmLoginDialog(Landroid/app/Activity;)V
              .registers 1
              return-void
          .end method
          
          .method public static deny(Landroid/app/Activity;)V
              .registers 1
              return-void
          .end method
          
          .method public static grant(Landroid/app/Activity;Ljava/lang/String;)V
              .registers 2
              return-void
          .end method
          
          .method public static isAuthorized(Landroid/app/Activity;)Z
              .registers 1
              const/4 v0, 0x1
              return v0
          .end method
          
          .method public static isFeatureSessionAuthorized(Landroid/content/Context;)Z
              .registers 1
              const/4 v0, 0x1
              return v0
          .end method
          
          .method public static isOwnerKillSwitchActive()Z
              .registers 1
              const/4 v0, 0x0
              return v0
          .end method
          
          .method public static lock()V
              .registers 0
              return-void
          .end method
          
          .method public static markLoginDialog(Landroid/app/Activity;Landroid/app/Dialog;)V
              .registers 2
              return-void
          .end method
          
          .method public static registerDialog(Landroid/app/Dialog;I)V
              .registers 2
              return-void
          .end method
          
          .method public static revokeForResult()V
              .registers 0
              return-void
          .end method
          EOF
          }

          write_user_without_login() {
            local target="$1"

            cat > "$target" <<'EOF'
          .class public final Lcom/SecurityGuardBrige/ArchersSmoothLoginers/UserWithoutLoginController;
          .super Ljava/lang/Object;
          .source "UserWithoutLoginController.java"
          
          .method private constructor <init>()V
              .registers 1
              invoke-direct {p0}, Ljava/lang/Object;-><init>()V
              return-void
          .end method
          
          .method public static consumeForceLoginPage()Z
              .registers 1
              const/4 v0, 0x0
              return v0
          .end method
          
          .method public static intercept(Landroid/app/Activity;)Z
              .registers 1
              const/4 v0, 0x0
              return v0
          .end method
          
          .method public static isTrialAuthorized(Landroid/app/Activity;)Z
              .registers 1
              const/4 v0, 0x1
              return v0
          .end method
          EOF
          }

          write_trial_checker() {
            local target="$1"

            cat > "$target" <<'EOF'
          .class public Lcom/SecurityGuardBrige/ArchersSmoothLoginers/TrialUnregisteredChecker;
          .super Ljava/lang/Object;
          .source "TrialUnregisteredChecker.java"
          
          .method public constructor <init>()V
              .registers 1
              invoke-direct {p0}, Ljava/lang/Object;-><init>()V
              return-void
          .end method
          
          .method public static isTrialActive(Landroid/content/Context;)Z
              .registers 1
              const/4 v0, 0x1
              return v0
          .end method
          EOF
          }

          SMOOTH=$(
            find_class \
              "com/SecurityGuardBrige/ArchersSmoothLoginers/SmooothApplicationMougraph"
          )

          GUARD=$(
            find_class \
              "com/SecurityGuardBrige/ArchersSmoothLoginers/FeatureAccessGuard"
          )

          NOLOGIN=$(
            find_class \
              "com/SecurityGuardBrige/ArchersSmoothLoginers/UserWithoutLoginController"
          )

          TRIAL=$(
            find_class \
              "com/SecurityGuardBrige/ArchersSmoothLoginers/TrialUnregisteredChecker"
          )

          {
            echo "Custom license patch report"
            echo "========================================"
            echo "SmooothApplicationMougraph: ${SMOOTH:-NOT FOUND}"
            echo "FeatureAccessGuard:         ${GUARD:-NOT FOUND}"
            echo "UserWithoutLoginController: ${NOLOGIN:-NOT FOUND}"
            echo "TrialUnregisteredChecker:   ${TRIAL:-NOT FOUND}"
          } | tee analysis/license-patch.txt

          if [ -z "$SMOOTH" ]; then
            echo "ERROR: SmooothApplicationMougraph.smali not found."
            exit 1
          fi

          if [ -z "$GUARD" ]; then
            echo "ERROR: FeatureAccessGuard.smali not found."
            exit 1
          fi

          if [ -z "$NOLOGIN" ]; then
            echo "ERROR: UserWithoutLoginController.smali not found."
            exit 1
          fi

          if [ -z "$TRIAL" ]; then
            echo "ERROR: TrialUnregisteredChecker.smali not found."
            exit 1
          fi

          write_smoooth_application "$SMOOTH"
          write_feature_guard "$GUARD"
          write_user_without_login "$NOLOGIN"
          write_trial_checker "$TRIAL"

          echo "Patch completed."

          echo "Removing dedicated login dialog payload..."

          DIALOG_ASSET="apk_source/assets/string_utils/activity_login_0.xml"
          if [ ! -f "$DIALOG_ASSET" ]; then
            echo "ERROR: dedicated login dialog asset was not found."
            exit 1
          fi
          rm -f "$DIALOG_ASSET"

          find apk_source/smali* -type f -name 'SmooothApplicationMougraph$*.smali' -print -delete

          R_LAYOUT=$(find_class 'com/SecurityGuardBrige/ArchersSmoothLoginers/R$layout')
          if [ -n "$R_LAYOUT" ] && [ -f "$R_LAYOUT" ]; then
            if grep -qF 'activity_login_0' "$R_LAYOUT"; then
              sed -i '/activity_login_0/d' "$R_LAYOUT"
              echo "Removed R$layout.activity_login_0"
            fi
          fi

          echo "Dedicated login dialog payload removed."

      - name: Verify Patched Classes and Dialog Removal
        shell: bash
        run: |
          set -euo pipefail

          grep -RniF ".method public static reactContent" apk_source/smali*
          grep -RniF ".method public static isAuthorized" apk_source/smali*
          grep -RniF ".method public static isFeatureSessionAuthorized" apk_source/smali*
          grep -RniF ".method public static isTrialAuthorized" apk_source/smali*
          grep -RniF ".method public static intercept" apk_source/smali*
          grep -RniF ".method public static isTrialActive" apk_source/smali*

          if [ -e apk_source/assets/string_utils/activity_login_0.xml ]; then
            echo "ERROR: activity_login_0.xml still exists."
            exit 1
          fi

          if find apk_source/smali* -type f -name 'SmooothApplicationMougraph$*.smali' | grep -q .; then
            echo "ERROR: SmooothApplicationMougraph inner classes still exist."
            exit 1
          fi

          R_LAYOUT=$(find apk_source/smali* -type f -name 'R$layout.smali' | head -n 1)
          if [ -n "$R_LAYOUT" ] && grep -qF "activity_login_0" "$R_LAYOUT"; then
            echo "ERROR: R$layout.activity_login_0 still exists."
            exit 1
          fi

          echo "Decoded project passed dialog removal verification."

      - name: Rebuild APK
        shell: bash
        run: |
          set -euo pipefail

          rm -f patched_unsigned.apk

          java -jar apktool.jar b \
            apk_source \
            -o patched_unsigned.apk

          if [ ! -f patched_unsigned.apk ]; then
            echo "ERROR: APK rebuild failed."
            exit 1
          fi

          ls -lh patched_unsigned.apk

          sha256sum patched_unsigned.apk \
            | tee rebuilt-apk-sha256.txt

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          java -jar uber-apk-signer.jar \
            --apks patched_unsigned.apk \
            -o dist/

          APK_SIGNED=$(
            find dist \
              -type f \
              -iname "*.apk" \
              | head -n 1
          )

          if [ -z "$APK_SIGNED" ]; then
            echo "ERROR: Signed APK was not generated."
            exit 1
          fi

          echo "APK_SIGNED=$APK_SIGNED" >> "$GITHUB_ENV"

          echo "Signed APK:"
          echo "$APK_SIGNED"

      - name: Verify Signed APK
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$APK_SIGNED" ]; then
            echo "ERROR: Signed APK does not exist."
            exit 1
          fi

          ls -lh "$APK_SIGNED"
          sha256sum "$APK_SIGNED"

      - name: Verify Final APK Has No Login Dialog Payload
        shell: bash
        run: |
          set -euo pipefail

          rm -rf final_apk_check
          mkdir -p final_apk_check
          unzip -q "$APK_SIGNED" -d final_apk_check

          if unzip -Z1 "$APK_SIGNED" | grep -Fx "assets/string_utils/activity_login_0.xml" >/dev/null; then
            echo "ERROR: dialog asset is still present in final APK."
            exit 1
          fi

          for dex in final_apk_check/classes*.dex; do
            [ -f "$dex" ] || continue

            if strings "$dex" | grep -F "SmooothApplicationMougraph$" >/dev/null; then
              echo "ERROR: SmooothApplicationMougraph inner-class payload remains in $dex."
              exit 1
            fi

            if strings "$dex" | grep -Fx "activity_login_0" >/dev/null; then
              echo "ERROR: activity_login_0 identifier remains in $dex."
              exit 1
            fi
          done

          echo "Final APK passed strict dialog-removal verification."

      - name: Upload Modified APK
        uses: actions/upload-artifact@v4
        with:
          name: ninja-without-custom-license
          path: ${{ env.APK_SIGNED }}
          if-no-files-found: error

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ninja-license-removal-report
          path: |
            original-apk-sha256.txt
            rebuilt-apk-sha256.txt
            analysis/license-patch.txt
          if-no-files-found: ignore
