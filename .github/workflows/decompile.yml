name: Inspect License Logic & Print Summary

on:
  workflow_dispatch:

jobs:
  inspect-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JADX
        run: |
          JADX_VERSION="1.5.0"
          wget -q https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip
          unzip -q jadx-${JADX_VERSION}.zip -d jadx
          sudo ln -s $(pwd)/jadx/bin/jadx /usr/local/bin/jadx

      - name: Decompile APK
        run: |
          echo "Decompiling ninja.apk..."
          jadx -d decompiled_src ninja.apk --no-res

      - name: Inspect and Generate GitHub Summary
        run: |
          echo "## 🔍 تقرير تحليل نظام الترخيص القديم (Ninja APK)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🌐 1. الروابط المكتشفة داخل حزمة الأمان" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -Erio "https?://[^\"'\s]+" decompiled_src/sources/com/SecurityGuardBrige/ | sort -u >> $GITHUB_STEP_SUMMARY \vert{}\vert{} echo "لم يتم العثور على روابط صريحة" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### 📄 2. كود فحص النسخة والتجربة (TrialUnregisteredChecker.java)" >> $GITHUB_STEP_SUMMARY
          TRIAL_FILE=$(find decompiled_src/sources/ -name "TrialUnregisteredChecker.java" | head -n 1)
          if [ -f "$TRIAL_FILE" ]; then
            echo '```java' >> $GITHUB_STEP_SUMMARY
            cat "$TRIAL_FILE" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "الملف غير موجود بالمسار المحدد." >> $GITHUB_STEP_SUMMARY
          fi

          echo "### 📄 3. كود التحكم بدون تسجيل (UserWithoutLoginController.java)" >> $GITHUB_STEP_SUMMARY
          CONTROLLER_FILE=$(find decompiled_src/sources/ -name "UserWithoutLoginController.java" | head -n 1)
          if [ -f "$CONTROLLER_FILE" ]; then
            echo '```java' >> $GITHUB_STEP_SUMMARY
            cat "$CONTROLLER_FILE" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "الملف غير موجود بالمسار المحدد." >> $GITHUB_STEP_SUMMARY
          fi

          echo "### 🔑 4. كود التحقق من التشفير والتوقيع (RSA Key Validator)" >> $GITHUB_STEP_SUMMARY
          RSA_FILE=$(find decompiled_src/sources/ -name "C2020b.java" | head -n 1)
          if [ -f "$RSA_FILE" ]; then
            echo '```java' >> $GITHUB_STEP_SUMMARY
            cat "$RSA_FILE" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "جاري البحث عن كلاس التشفير..." >> $GITHUB_STEP_SUMMARY
            find decompiled_src/sources/ -type f -exec grep -l "X509EncodedKeySpec" {} + | head -n 1 | xargs cat >> $GITHUB_STEP_SUMMARY || true
          fi

      - name: Print Output to Console Log
        run: |
          echo "==================== ENDPOINTS ===================="
          grep -Erio "https?://[^\"'\s]+" decompiled_src/sources/com/SecurityGuardBrige/ | sort -u || true
          echo "==================================================="
