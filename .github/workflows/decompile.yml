name: Decompile & Analyze Legacy License

on:
  workflow_dispatch:
  push:
    paths:
      - 'ninja.apk'

jobs:
  analyze-license:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JADX
        run: |
          JADX_VERSION="1.5.0"
          wget -q https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip
          unzip -q jadx-${JADX_VERSION}.zip -d jadx
          sudo ln -s $(pwd)/jadx/bin/jadx /usr/local/bin/jadx
          jadx --version

      - name: Decompile APK
        run: |
          echo "جاري تفكيك التطبيق..."
          jadx -d decompiled_src ninja.apk --show-bad-code

      - name: Extract Licensing Architecture
        run: |
          mkdir -p license_analysis_report

          echo "=== 1. مسارات الروابط ونقاط النهاية (API Endpoints) ===" > license_analysis_report/endpoints.txt
          grep -Erio "https?://[^\"'\s]+" decompiled_src/ | sort -u >> license_analysis_report/endpoints.txt || true

          echo "=== 2. استدعاءات الترخيص وحقول المفاتيح ===" > license_analysis_report/license_fields.txt
          grep -Eri "(license|licence|verify|activate|serial|device_id|hwid|machine_id)" decompiled_src/sources/ | grep -v "/android/" | head -n 300 >> license_analysis_report/license_fields.txt || true

          echo "=== 3. فحص خوارزميات التشفير والتوقيع (Cryptography) ===" > license_analysis_report/crypto_signatures.txt
          grep -Eri "(Signature\.getInstance|Cipher\.getInstance|KeyFactory|X509EncodedKeySpec)" decompiled_src/sources/ >> license_analysis_report/crypto_signatures.txt || true

          echo "=== 4. فحص مكتبات الترخيص الرسمية (مثل Google Play LVL) ===" > license_analysis_report/lvl_check.txt
          grep -rn "com.android.vending.licensing" decompiled_src/sources/ >> license_analysis_report/lvl_check.txt || true

          # تجميع ملخص تحليلي للملفات الحيوية
          echo "=== 5. الملفات التي تحتوي على منطق الترخيص الرئيسي ===" > license_analysis_report/key_classes.txt
          find decompiled_src/sources/ -type f \( -iname "*license*" -o -iname "*licence*" -o -iname "*activation*" -o -iname "*auth*" \) >> license_analysis_report/key_classes.txt || true

      - name: Upload Analysis Reports
        uses: actions/upload-artifact@v4
        with:
          name: license-architecture-report
          path: license_analysis_report/

      - name: Upload Full Decompiled Source (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-ninja-source
          path: decompiled_src/sources/
