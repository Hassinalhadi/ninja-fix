name: Extract Target License Files

on:
  workflow_dispatch:

jobs:
  extract-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JADX
        run: |
          JADX_VERSION="1.5.0"
          wget -q https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip
          unzip -q jadx-${JADX_VERSION}.zip -d jadx
          sudo ln -s $(pwd)/jadx/bin/jadx /usr/local/bin/jadx
          jadx --version

      - name: Decompile APK
        run: |
          echo "جاري تفكيك ninja.apk..."
          jadx -d decompiled_src ninja.apk --show-bad-code

      - name: Locate and Collect Target Files
        run: |
          mkdir -p extracted_license_files

          # 1. نسخ كلاسات الحزمة الرئيسية المسؤولة عن الترخيص
          mkdir -p extracted_license_files/SecurityGuardBrige
          find decompiled_src/sources/ -path "*SecurityGuardBrige*" -name "*.java" -exec cp {} extracted_license_files/SecurityGuardBrige/ \;

          # 2. نسخ كلاس التحقق والتشفير k8/C2020b.java (أو أي كلاس مشابه في نفس المسار)
          mkdir -p extracted_license_files/k8
          find decompiled_src/sources/ -path "*/k8/*" -name "*.java" -exec cp {} extracted_license_files/k8/ \;

          # 3. استخراج ملف AndroidManifest.xml لمراجعة الـ Permissions والـ Services المرتبطة
          cp decompiled_src/resources/AndroidManifest.xml extracted_license_files/ || true

          # 4. طباعة قائمة بالملفات التي تم جمعها للتأكد
          echo "=== الملفات المستخرجة بنجاح ==="
          ls -R extracted_license_files

      - name: Upload Extracted Files
        uses: actions/upload-artifact@v4
        with:
          name: target-license-code
          path: extracted_license_files/
