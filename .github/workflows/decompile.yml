name: Decompile APK to Source Code

on:
  workflow_dispatch: # يتيح لك تشغيل الإجراء يدوياً من واجهة GitHub
  push:
    paths:
      - '*.apk'        # يعمل تلقائياً عند رفع ملف APK في المجلد الرئيسي

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JADX
        run: |
          JADX_VERSION="1.5.0"
          wget -q https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip
          unzip -q jadx-${JADX_VERSION}.zip -d jadx
          sudo ln -s $(pwd)/jadx/bin/jadx /usr/local/bin/jadx
          jadx --version

      - name: Find and Decompile APK
        run: |
          # البحث عن ملف APK في المستودع (مثل ninja.apk)
          APK_FILE=$(find . -maxdepth 2 -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found in the repository."
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          
          # مسار إخراج الكود المفكك
          OUTPUT_DIR="source_code"
          mkdir -p $OUTPUT_DIR
          
          # تفكيك الـ APK مع استخراج موارد الـ XML وكود Java
          jadx -d $OUTPUT_DIR \
               --show-bad-code \
               --export-gradle \
               "$APK_FILE"

      - name: Commit and Push Decompiled Code
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # إنشاء فرع جديد للكود المفكك أو الرفع على فرع خاص
          BRANCH_NAME="decompiled-source"
          git checkout -B $BRANCH_NAME
          
          git add source_code/
          git commit -m "Auto-decompile APK to source code" || echo "No changes to commit"
          git push -f origin $BRANCH_NAME

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-project
          path: source_code/
