name: Inspect License Logic & Print Summary

on:
  workflow_dispatch:

jobs:
  inspect-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JADX
        run: |
          wget -q https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          unzip -q jadx-1.5.0.zip -d jadx
          sudo ln -s $(pwd)/jadx/bin/jadx /usr/local/bin/jadx

      - name: Decompile APK
        run: |
          echo "جاري تفكيك التطبيق..."
          jadx -d decompiled_src ninja.apk --no-res --show-bad-code || true

      - name: Inspect and Generate GitHub Summary
        run: |
          echo "## 🔍 تقرير استخراج كود ونظام الترخيص" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🌐 1. الروابط المكتشفة داخل الكود" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -Erio "https?://[^\"'\s]+" decompiled_src/sources/ 2>/dev/null | grep -Ei "(archer|license|verify|auth|gate)" | sort -u | head -n 30 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### 📄 2. ملفات فحص الحساب والتسجيل" >> $GITHUB_STEP_SUMMARY
          for file in $(find decompiled_src/sources/ -type f \( -name "*Trial*.java" -o -name "*UserWithoutLogin*.java" \) 2>/dev/null); do
            echo "#### الملف: $(basename $file)" >> $GITHUB_STEP_SUMMARY
            echo '```java' >> $GITHUB_STEP_SUMMARY
            head -n 120 "$file" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

          echo "### 🔑 3. ملف فحص وتوليد مفاتيح RSA" >> $GITHUB_STEP_SUMMARY
          RSA_FILE=$(grep -rnwl "X509EncodedKeySpec" decompiled_src/sources/ 2>/dev/null | head -n 1)
          if [ -n "$RSA_FILE" ]; then
            echo "#### الملف: $(basename $RSA_FILE)" >> $GITHUB_STEP_SUMMARY
            echo '```java' >> $GITHUB_STEP_SUMMARY
            head -n 120 "$RSA_FILE" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: step-summary-report
          path: decompiled_src/sources/com/SecurityGuardBrige/
