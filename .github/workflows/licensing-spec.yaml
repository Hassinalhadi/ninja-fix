openapi: 3.0.3
info:
  title: Ninja Unified Licensing Server
  description: نظام ترخيص هجين يدعم استدعاءات تطبيق Ninja القديم والنظام المطور الجديد.
  version: 2.0.0

servers:
  - url: https://your-license-server.com
    description: Production License Gateway

paths:
  # ==========================================
  # 1. مسارات التوافق مع التطبيق القديم (Legacy Endpoints)
  # ==========================================
  /SmileMorden/server/user_trial_status.php:
    get:
      summary: Legacy Trial & License Status
      description: المسار الذي يستدعيه UserWithoutLoginController في التطبيق القديم
      responses:
        '200':
          description: إرجاع كائن الحالة المتوافق مع كلاس TrialStatus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyTrialStatus'
              example:
                effective: true
                secondsRemaining: 2592000
                pollAfterMs: 86400000

  /SmileMorden/server/trial_unregistered.php:
    get:
      summary: Legacy Unregistered Checker
      description: المسار الذي يستدعيه TrialUnregisteredChecker
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            example: status
      responses:
        '200':
          description: حالة تفعيل الوضع التجريبي للمستخدمين
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  trial_unreg_enabled:
                    type: boolean
                    example: true

  # ==========================================
  # 2. مسارات النظام الجديد المطور (Modern v2 Endpoints)
  # ==========================================
  /api/v2/license/activate:
    post:
      summary: Activate Modern License
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - license_key
                - device_id
              properties:
                license_key:
                  type: string
                device_id:
                  type: string
      responses:
        '200':
          description: تم تفعيل الرخصة وتوليد Token حديث
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time

components:
  schemas:
    LegacyTrialStatus:
      type: object
      required:
        - effective
        - secondsRemaining
        - pollAfterMs
      properties:
        effective:
          type: boolean
          description: تفعيل صلاحية الاستخدام وتجاوز صفحة القفل
        secondsRemaining:
          type: integer
          format: int64
          description: عدد الثواني المتبقية لصلاحية الترخيص
        pollAfterMs:
          type: integer
          format: int64
          description: المدة الزمنية قبل إعادة الاستعلام بالميللي ثانية
