name: Build & Patch License System

on:
  workflow_dispatch:

jobs:
  patch-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Tools
        run: |
          echo "⬇️ جاري تحميل الأدوات من GitHub..."
          curl -fSL "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" -o apktool.jar
          curl -fSL "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar" -o uber-apk-signer.jar
          echo "✅ تم تحميل الأدوات بنجاح."

      - name: Decompile APK
        run: |
          APK_FILE=$(find . -maxdepth 3 -iname "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ لم يتم العثور على ملف APK"
            exit 1
          fi
          echo "Target APK: $APK_FILE"
          java -jar apktool.jar d -r "$APK_FILE" -o apk_source -f

      - name: Write Clean FeatureAccessGuard Smali
        run: |
          TARGET_FILE=$(find apk_source/smali* -type f -name "FeatureAccessGuard.smali" 2>/dev/null | head -n 1)

          if [ -z "$TARGET_FILE" ]; then
            echo "❌ لم يتم العثور على FeatureAccessGuard.smali"
            exit 1
          fi

          echo "Target found: $TARGET_FILE"

          # استبدال الملف بالكامل بكود Smali متوافق وصحيح نحوياً 100%
          cat << 'EOF' > "$TARGET_FILE"
.class public final Lcom/SecurityGuardBrige/ArchersSmoothLoginers/FeatureAccessGuard;
.super Ljava/lang/Object;
.source "FeatureAccessGuard.java"

# static fields
.field public static final FEATURE_ARCHERS:I = 0x51
.field public static final FEATURE_PANEL:I = 0xa7
.field private static volatile activeDialog:Landroid/app/Dialog;
.field private static volatile authorized:Z = true

# direct methods
.method static constructor <clinit>()V
    .registers 1
    const/4 v0, 0x1
    sput-boolean v0, Lcom/SecurityGuardBrige/ArchersSmoothLoginers/FeatureAccessGuard;->authorized:Z
    return-void
.end method

.method private constructor <init>()V
    .registers 1
    invoke-direct {p0}, Ljava/lang/Object;-><init>()V
    return-void
.end method

.method public static activateTrial(Landroid/app/Activity;)Z
    .registers 2
    const/4 v0, 0x1
    return v0
.end method

.method public static authorizeFeature(Landroid/app/Activity;I)Z
    .registers 3
    const/4 v0, 0x1
    sput-boolean v0, Lcom/SecurityGuardBrige/ArchersSmoothLoginers/FeatureAccessGuard;->authorized:Z
    return v0
.end method

.method public static beginVerification(Landroid/app/Activity;)V
    .registers 2
    const/4 v0, 0x1
    sput-boolean v0, Lcom/SecurityGuardBrige/ArchersSmoothLoginers/FeatureAccessGuard;->authorized:Z
    return-void
.end method

.method public static completeCallback()V
    .registers 0
    return-void
.end method

.method public static confirmLoginDialog(Landroid/app/Activity;)V
    .registers 2
    const/4 v0, 0x1
    sput-boolean v0, Lcom/SecurityGuardBrige/ArchersSmoothLoginers/FeatureAccessGuard;->authorized:Z
    return-void
.end method

.method public static deny(Landroid/app/Activity;)V
    .registers 1
    return-void
.end method

.method public static grant(Landroid/app/Activity;Ljava/lang/String;)V
    .registers 3
    const/4 v0, 0x1
    sput-boolean v0, Lcom/SecurityGuardBrige/ArchersSmoothLoginers/FeatureAccessGuard;->authorized:Z
    return-void
.end method

.method public static isAuthorized(Landroid/app/Activity;)Z
    .registers 2
    const/4 v0, 0x1
    return v0
.end method

.method public static isFeatureSessionAuthorized(Landroid/content/Context;)Z
    .registers 2
    const/4 v0, 0x1
    return v0
.end method

.method public static isOwnerKillSwitchActive()Z
    .registers 1
    const/4 v0, 0x0
    return v0
.end method

.method public static lock()V
    .registers 0
    return-void
.end method

.method public static markLoginDialog(Landroid/app/Activity;Landroid/app/Dialog;)V
    .registers 2
    sput-object p1, Lcom/SecurityGuardBrige/ArchersSmoothLoginers/FeatureAccessGuard;->activeDialog:Landroid/app/Dialog;
    return-void
.end method

.method public static registerDialog(Landroid/app/Dialog;I)V
    .registers 2
    sput-object p0, Lcom/SecurityGuardBrige/ArchersSmoothLoginers/FeatureAccessGuard;->activeDialog:Landroid/app/Dialog;
    return-void
.end method

.method public static revokeForResult()V
    .registers 0
    return-void
.end method
EOF

          echo "✅ تم استبدال الكود بنسخة Smali نظيفة ومتوافقة."

      - name: Rebuild APK
        run: |
          echo "🔨 جاري إعادة تجميع التطبيق..."
          java -jar apktool.jar b apk_source -o patched_unsigned.apk

      - name: Sign APK
        run: |
          echo "✍️ جاري توقيع التطبيق..."
          mkdir -p dist
          java -jar uber-apk-signer.jar --apks patched_unsigned.apk -o dist/

      - name: Upload Patched APK
        uses: actions/upload-artifact@v4
        with:
          name: Patched-Application
          path: dist/*-aligned-debugSigned.apk
