name: Deep License Analysis

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip binutils python3-pip
          pip3 install androguard

      - name: Analyze License Classes
        run: |
          python3 - << 'PY_SCRIPT'
          import os
          import glob
          from androguard.misc import AnalyzeAPK

          summary = []
          summary.append("## 🎯 التحليل المركز لكلاسات الترخيص (SecurityGuardBrige)")

          apk_files = glob.glob("**/*.apk", recursive=True)
          if not apk_files:
              summary.append("❌ لم يتم العثور على أي ملف APK داخل المستودع!")
          else:
              apk_path = apk_files[0]
              summary.append(f"تم العثور على ملف APK: `{apk_path}`")
              try:
                  a, d, dx = AnalyzeAPK(apk_path)
                  target_classes = [
                      c for c in dx.get_classes()
                      if "SecurityGuardBrige" in c.name or "CheckLoginStatus" in c.name
                  ]
                  summary.append(f"تم العثور على `{len(target_classes)}` كلاس متعلق بالترخيص.\n")
                  for cls in target_classes:
                      summary.append(f"### الكلاس: `{cls.name}`")
                      strings_in_class = set()
                      for m in cls.get_methods():
                          for _, ins, _ in m.get_instructions():
                              if ins.get_name() == "const-string":
                                  val = ins.get_output().split(",")[-1].strip().strip('"')
                                  if len(val) > 1 and not val.startswith("L"):
                                      strings_in_class.add(val)
                      if strings_in_class:
                          summary.append("```text")
                          for s in sorted(strings_in_class):
                              summary.append(s)
                          summary.append("```")
                      fields = [f.name for f in cls.get_fields()]
                      if fields:
                          summary.append(f"**الحقول:** `{', '.join(fields)}`")
              except Exception as e:
                  summary.append(f"خطأ أثناء التحليل: {e}")

          summary_text = "\n".join(summary)
          step_summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary_path:
              with open(step_summary_path, "a", encoding="utf-8") as f:
                  f.write(summary_text + "\n")
          else:
              print(summary_text)
          PY_SCRIPT
