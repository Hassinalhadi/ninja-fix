name: Deep License Analysis

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JADX & Decompile License
        run: |
          # 1. تنزيل أداة JADX للـ Decompile
          wget -q https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          unzip -q jadx-1.5.0.zip -d jadx-bin
          chmod +x jadx-bin/bin/jadx

          APK_FILE=$(find . -maxdepth 3 -iname "*ninja*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -maxdepth 3 -iname "*.apk" | head -n 1)
          fi

          if [ -z "$APK_FILE" ]; then
            echo "❌ لم يتم العثور على ملف APK" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "APK المستهدف: $APK_FILE"
          
          # فك كود Java للحزمة المحددة مع تخطي الموارد لزيادة السرعة
          ./jadx-bin/bin/jadx -d jadx_out --no-res --include-pkg com.SecurityGuardBrige "$APK_FILE" || ./jadx-bin/bin/jadx -d jadx_out --no-res "$APK_FILE" || true

          echo "## 📄 كود Java المستخرج لكلاسات الترخيص (Decompiled Java)" >> $GITHUB_STEP_SUMMARY
          
          FOUND_JAVA=$(find jadx_out/sources -type f -name "*.java" 2>/dev/null)
          if [ -z "$FOUND_JAVA" ]; then
            echo "لم يتم العثور على ملفات Java مفكوكة." >> $GITHUB_STEP_SUMMARY
          else
            for file in $(find jadx_out/sources -type f -name "*.java"); do
              filename=$(basename "$file")
              # التركيز على الكلاسات الهامة بالترخيص
              if [[ "$filename" =~ (CheckLogin|FeatureAccess|SmooothApplication|UserBroadcast) ]]; then
                echo "### 🔍 كود الكلاس: \`$filename\`" >> $GITHUB_STEP_SUMMARY
                echo "\`\`\`java" >> $GITHUB_STEP_SUMMARY
                cat "$file" | head -n 150 >> $GITHUB_STEP_SUMMARY
                echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi
