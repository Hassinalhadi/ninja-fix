name: Extract Exact JSON Keys From Assembly

on:
  workflow_dispatch:

jobs:
  disassemble-and-extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Exact Parameter and JSON Keys
        run: |
          unzip -q ninja.apk -d apk_unpacked

          python3 - << 'EOF'
          import os, subprocess, re

          so_path = "apk_unpacked/lib/arm64-v8a/libstub.so"
          if not os.path.exists(so_path):
              for root, dirs, files in os.walk("apk_unpacked/lib"):
                  if "libstub.so" in files:
                      so_path = os.path.join(root, "libstub.so")
                      break

          # 1. استخراج النصوص ومواقعها بالإزاحة (Offset)
          cmd = ["strings", "-a", "-t", "x", so_path]
          res = subprocess.run(cmd, stdout=subprocess.PIPE, text=True)
          strings_with_offset = []
          for line in res.stdout.splitlines():
              parts = line.strip().split(maxsplit=1)
              if len(parts) == 2:
                  offset = int(parts[0], 16)
                  text = parts[1]
                  strings_with_offset.append((offset, text))

          # 2. تحديد موقع توقيع (ZJJ)V ومسار user_trial_status.php
          target_offsets = []
          for off, s in strings_with_offset:
              if s in ["(ZJJ)V", "user_trial_status.php", "trial_unregistered.php"]:
                  target_offsets.append((off, s))

          summary = []
          summary.append("## 🎯 المفاتيح النصية الدقيقة لدوال قراءة JSON في libstub.so")
          summary.append("")

          for target_off, target_name in target_offsets:
              summary.append(f"### 📍 النصوص المحيطة في الذاكرة بـ: `{target_name}` (الإزاحة: `0x{target_off:x}`)")
              summary.append("```text")
              # جلب النصوص الواقعة في نطاق 2KB حول موقع التوقيع
              nearby = [s for off, s in strings_with_offset if abs(off - target_off) < 2500]
              for item in nearby:
                  summary.append(item)
              summary.append("```")

          # 3. استخراج جميع السلاسل النصية التي تطابق أسماء مفاتيح برمجية قصيرة (JSON Property Keys)
          summary.append("### 🔑 جميع أسماء الخصائص (JSON Keys) المشبوهة داخل المكتبة:")
          summary.append("```text")
          property_keys = set()
          for off, s in strings_with_offset:
              # فلترة الكلمات الإنجليزية الصالحة كمفاتيح JSON بين 2 و 25 حرفاً
              if re.match(r"^[a-zA-Z_][a-zA-Z0-9_]{1,25}$", s):
                  if any(k in s.lower() for k in ["status", "remain", "expire", "poll", "delay", "active", "time", "valid", "effect", "enable", "second", "code", "token"]):
                      property_keys.add(s)
          
          for k in sorted(property_keys):
              summary.append(k)
          summary.append("```")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(summary))
          EOF
