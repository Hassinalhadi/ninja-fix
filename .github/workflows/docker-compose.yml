version: '3.8'

services:
  license-gateway:
    image: node:18-alpine
    container_name: ninja-license-service
    restart: always
    ports:
      - "80:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - ./server:/app
    working_dir: /app
    command: sh -c "npm install express && node server.js"
