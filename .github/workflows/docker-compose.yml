name: Build & Patch License System

on:
  workflow_dispatch:

jobs:
  patch-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Tools (Apktool & Uber-APK-Signer from GitHub Releases)
        run: |
          echo "⬇️ جاري تحميل الأدوات من GitHub..."
          # تحميل Apktool الرسمي من GitHub
          curl -fSL "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" -o apktool.jar || \
          curl -fSL "https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar" -o apktool.jar
          
          # تحميل أداة التوقيع الرسمية
          curl -fSL "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar" -o uber-apk-signer.jar
          
          echo "✅ تم تحميل الأدوات بنجاح."

      - name: Decompile APK
        run: |
          APK_FILE=$(find . -maxdepth 3 -iname "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ لم يتم العثور على ملف APK"
            exit 1
          fi
          echo "Target APK: $APK_FILE"
          
          # استخدام -r لتخطي فك الموارد وحماية ملفات XML/arsc من أخطاء التجميع
          java -jar apktool.jar d -r "$APK_FILE" -o apk_source -f

      - name: Patch FeatureAccessGuard (Bypass Native License Checks)
        run: |
          TARGET_FILE=$(find apk_source/smali* -type f -name "FeatureAccessGuard.smali" 2>/dev/null | head -n 1)

          if [ -z "$TARGET_FILE" ]; then
            echo "❌ لم يتم العثور على FeatureAccessGuard.smali"
            exit 1
          fi

          echo "Target found: $TARGET_FILE"

          # 1. إزالة استدعاءات تسجيل الـ Native لمنع كراش مكتبة C++
          sed -i '/registerNativesForClass/d' "$TARGET_FILE"
          sed -i '/special_clinit/d' "$TARGET_FILE"

          # 2. تعديل دوال الحماية لتعيد true (0x1) مباشرة
          python3 -c "
          import re

          with open('$TARGET_FILE', 'r') as f:
              content = f.read()

          def replace_method(name, ret_val):
              pattern = rf'\.method public static native {name}\((.*?)\)Z\s*\.end method'
              replacement = f'''.method public static {name}(\\1)Z
              .registers 3
              const/4 v0, {ret_val}
              return v0
          .end method'''
              return re.sub(pattern, replacement, content)

          # ترخيص جميع الميزات
          content = replace_method('isAuthorized', '0x1')
          content = replace_method('authorizeFeature', '0x1')
          content = replace_method('isFeatureSessionAuthorized', '0x1')
          content = replace_method('activateTrial', '0x1')
          content = replace_method('isOwnerKillSwitchActive', '0x0')

          with open('$TARGET_FILE', 'w') as f:
              f.write(content)
          "

          echo "✅ تم تعديل كود الترخيص بنجاح."

      - name: Rebuild APK
        run: |
          echo "🔨 جاري إعادة تجميع التطبيق..."
          java -jar apktool.jar b apk_source -o patched_unsigned.apk

      - name: Sign APK
        run: |
          echo "✍️ جاري توقيع التطبيق..."
          mkdir -p dist
          java -jar uber-apk-signer.jar --apks patched_unsigned.apk -o dist/

      - name: Upload Patched APK
        uses: actions/upload-artifact@v4
        with:
          name: Patched-Application
          path: dist/*-aligned-debugSigned.apk
