name: Deep License Protocol Extraction

on:
  workflow_dispatch:

jobs:
  analyze-license:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip binutils p7zip-full radare2 python3-pip
          pip3 install androguard

      - name: Locate and Unpack APK
        run: |
          APK_PATH=$(find . -maxdepth 3 -iname "*ninja*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -maxdepth 3 -iname "*.apk" | head -n 1)
          fi
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ لم يتم العثور على أي ملف APK داخل المستودع!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          mkdir -p apk_extracted
          unzip -q "$APK_PATH" -d apk_extracted/

      - name: Analyze Request Parameters & Response Fields
        run: |
          echo "## 🔑 3. حقول الاستجابة ومعاملات الطلب المستخرجة" >> $GITHUB_STEP_SUMMARY
          echo "يتم الآن فك وتدقيق مسارات الاتصال ومعاملات الحزم عبر DEX و Native Layer." >> $GITHUB_STEP_SUMMARY

          cat << 'EOF' > parse_license.py
          import os
          import re
          import glob
          import subprocess

          summary_lines = []

          # 1. البحث في كلاسات DEX
          summary_lines.append("### 📦 تحليل طبقة Dalvik / DEX (الطلب والاستجابة)")
          dex_files = glob.glob("apk_extracted/*.dex")
          
          target_keywords = [
              "user_trial_status", "CheckLoginStatusTask", "FeatureAccessGuard",
              "failed_expired", "eapKey", "etPassword", "badge", "status", "success",
              "expires", "expired", "token", "auth", "device_id"
          ]

          extracted_strings = set()
          url_params = set()
          json_keys = set()

          for dex in dex_files:
              cmd = ["strings", dex]
              res = subprocess.run(cmd, stdout=subprocess.PIPE, text=True, errors="ignore")
              lines = res.stdout.splitlines()
              for line in lines:
                  line_str = line.strip()
                  for kw in target_keywords:
                      if kw.lower() in line_str.lower() and len(line_str) < 120:
                          extracted_strings.add(line_str)
                  
                  # كشف المعاملات المحتملة مثل key= أو &param=
                  param_matches = re.findall(r'[?&]([a-zA-Z0-9_\-]+)=', line_str)
                  for pm in param_matches:
                      url_params.add(pm)

                  # كشف مفاتيح JSON المحتملة
                  if re.match(r'^[a-zA-Z0-9_]{2,25}$', line_str):
                      if any(k in line_str.lower() for k in ["status", "code", "msg", "expir", "user", "trial", "key", "token", "role"]):
                          json_keys.add(line_str)

          summary_lines.append("#### 🌐 نصوص ورموز بروتوكول الاتصال في DEX:")
          summary_lines.append("```text")
          for s in sorted(list(extracted_strings))[:40]:
              summary_lines.append(s)
          summary_lines.append("```")

          if url_params:
              summary_lines.append("#### 📤 معاملات الاستعلام المكتشفة (Query / POST Parameters):")
              summary_lines.append("```text")
              for p in sorted(list(url_params)):
                  summary_lines.append(f"- {p}")
              summary_lines.append("```")

          summary_lines.append("#### 📥 حقول الاستجابة المتوقعة (Response Keys / JSON Fields):")
          summary_lines.append("```text")
          for jk in sorted(list(json_keys))[:25]:
              summary_lines.append(f"- {jk}")
          summary_lines.append("```")

          # 2. تحليل مكتبة libstub.so
          so_path = "apk_extracted/lib/arm64-v8a/libstub.so"
          if not os.path.exists(so_path):
              # تجربة مسارات أخرى
              so_candidates = glob.glob("apk_extracted/lib/*/libstub.so")
              if so_candidates:
                  so_path = so_candidates[0]

          if os.path.exists(so_path):
              summary_lines.append("### 🛡️ تحليل Native Layer (`libstub.so`)")
              # الرموز المصدرة
              cmd_nm = ["readelf", "-Ws", so_path]
              res_nm = subprocess.run(cmd_nm, stdout=subprocess.PIPE, text=True, errors="ignore")
              symbols = [l for l in res_nm.stdout.splitlines() if any(term in l for term in ["Java_", "constantString", "enforce", "CheckLogin"])]
              
              summary_lines.append("#### الدوال المصدرة (Exported JNI Functions):")
              summary_lines.append("```text")
              for sym in symbols[:15]:
                  summary_lines.append(sym)
              summary_lines.append("```")

          # كتابة النتيجة لـ GITHUB_STEP_SUMMARY
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(summary_lines) + "\n")
          EOF

          python3 parse_license.py
