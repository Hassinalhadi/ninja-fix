```yml
name: Remove Custom License UI

on:
  workflow_dispatch:

jobs:
  remove-custom-license-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Project
        shell: bash
        run: |
          set -e

          if [ ! -d "source_code" ]; then
            echo "ERROR: source_code directory not found."
            exit 1
          fi

          if [ ! -f "source_code/app/src/main/res/layout/activity_login_0.xml" ]; then
            echo "ERROR: activity_login_0.xml not found."
            exit 1
          fi

      - name: Remove Custom License Layout
        shell: bash
        run: |
          set -e

          rm -f \
            source_code/app/src/main/res/layout/activity_login_0.xml

          echo "Custom license layout removed."

      - name: Remove Custom License Classes
        shell: bash
        run: |
          set -e

          BASE="source_code/app/src/main/java/com/SecurityGuardBrige/ArchersSmoothLoginers"

          rm -f "$BASE/SmooothApplicationMougraph.java"
          rm -f "$BASE/FeatureAccessGuard.java"
          rm -f "$BASE/UserWithoutLoginController.java"
          rm -f "$BASE/TrialUnregisteredChecker.java"

          echo "Custom license classes removed."

      - name: Check Remaining References
        shell: bash
        run: |
          set +e

          grep -RniE \
            "SmooothApplicationMougraph|FeatureAccessGuard|UserWithoutLoginController|TrialUnregisteredChecker|activity_login_0" \
            source_code/app/src/main \
            > remaining-license-references.txt 2>/dev/null

          if [ -s remaining-license-references.txt ]; then
            echo "Remaining references detected:"
            cat remaining-license-references.txt
            exit 1
          fi

          echo "No remaining custom-license references found."

      - name: Build Application
        working-directory: source_code
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            :app:assembleProductionRelease \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find source_code/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "Generated APK:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ninja-without-custom-license-ui
          path: ${{ env.APK }}

      - name: Upload Analysis Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-removal-report
          path: remaining-license-references.txt
          if-no-files-found: ignore
```
