name: Analyze APK License System

on:
  workflow_dispatch:

jobs:
  analyze-license:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Download Apktool
        run: |
          set -e
          curl -fL \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" \
            -o apktool.jar

          java -version
          java -jar apktool.jar --version

      - name: Locate APK
        run: |
          set -e

          APK_FILE=$(find . -type f -iname "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found."
            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "Found APK: $APK_FILE"

      - name: Calculate APK Hash
        run: |
          sha256sum "$APK_FILE" | tee apk-sha256.txt
          ls -lh "$APK_FILE"

      - name: Decompile APK
        run: |
          set -e

          rm -rf apk_source

          java -jar apktool.jar d \
            "$APK_FILE" \
            -o apk_source \
            -f \
            -r

          echo "APK decompiled successfully."

      - name: Analyze License References
        shell: bash
        run: |
          set +e

          mkdir -p analysis

          REPORT="analysis/license-report.txt"

          {
            echo "========================================"
            echo " APK LICENSE SYSTEM ANALYSIS"
            echo "========================================"
            echo
            echo "APK:"
            echo "$APK_FILE"
            echo
            echo "Generated:"
            date -u
            echo

            echo "----------------------------------------"
            echo "1. POSSIBLE LICENSE FILES / CLASSES"
            echo "----------------------------------------"

            find apk_source \
              -type f \
              \( -iname "*license*" \
              -o -iname "*authorize*" \
              -o -iname "*authorization*" \
              -o -iname "*entitlement*" \
              -o -iname "*subscription*" \
              -o -iname "*activation*" \
              -o -iname "*premium*" \
              -o -iname "*purchase*" \
              -o -iname "*billing*" \
              -o -iname "*securityguard*" \
              \) \
              -print

            echo
            echo "----------------------------------------"
            echo "2. LICENSE-RELATED TEXT REFERENCES"
            echo "----------------------------------------"

            grep -RniE \
              --binary-files=without-match \
              "license|licensed|licence|authorize|authorized|authorization|entitlement|activation|activate|subscription|premium|purchase|billing|trial|expiry|expired|featureaccessguard|killswitch" \
              apk_source \
              > analysis/license-text-matches.txt 2>/dev/null

            cat analysis/license-text-matches.txt

            echo
            echo "----------------------------------------"
            echo "3. IMPORTANT METHOD REFERENCES"
            echo "----------------------------------------"

            grep -RniE \
              --binary-files=without-match \
              "\.method .*isAuthorized|\.method .*authorizeFeature|\.method .*isFeatureSessionAuthorized|\.method .*activateTrial|\.method .*grant|\.method .*revoke|\.method .*lock|\.method .*deny|\.method .*beginVerification|\.method .*completeCallback|\.method .*isOwnerKillSwitchActive" \
              apk_source/smali* \
              > analysis/license-methods.txt 2>/dev/null

            cat analysis/license-methods.txt

            echo
            echo "----------------------------------------"
            echo "4. NATIVE LIBRARY REFERENCES"
            echo "----------------------------------------"

            find apk_source \
              -type f \
              \( -name "*.so" -o -name "*.bin" \) \
              -print 2>/dev/null

            echo
            echo "Native strings:"
            
            find apk_source \
              -type f \
              \( -name "*.so" -o -name "*.bin" \) \
              -exec strings {} \; 2>/dev/null \
              | grep -iE \
                "license|authorize|activation|subscription|premium|trial|expired|feature|security|verify|token|entitlement|owner" \
              | sort -u

            echo
            echo "----------------------------------------"
            echo "5. ANDROID MANIFEST REFERENCES"
            echo "----------------------------------------"

            if [ -f apk_source/AndroidManifest.xml ]; then
              grep -niE \
                "license|authorize|security|billing|service|receiver|provider" \
                apk_source/AndroidManifest.xml \
                || true
            fi

            echo
            echo "----------------------------------------"
            echo "6. NETWORK / API REFERENCES"
            echo "----------------------------------------"

            grep -RniE \
              --binary-files=without-match \
              "https?://|/license|/auth|/verify|/activate|/subscription|/entitlement" \
              apk_source \
              > analysis/network-references.txt 2>/dev/null

            cat analysis/network-references.txt

            echo
            echo "----------------------------------------"
            echo "7. TOKEN / STORAGE REFERENCES"
            echo "----------------------------------------"

            grep -RniE \
              --binary-files=without-match \
              "SharedPreferences|sharedpreferences|license_key|licenseKey|activation_key|activationKey|auth_token|token|subscription|premium" \
              apk_source \
              > analysis/storage-references.txt 2>/dev/null

            cat analysis/storage-references.txt

            echo
            echo "========================================"
            echo " END OF ANALYSIS"
            echo "========================================"

          } | tee "$REPORT"

      - name: Create Summary
        shell: bash
        run: |
          {
            echo "# APK License Analysis"
            echo

            echo "## APK Hash"
            echo '```'
            cat apk-sha256.txt
            echo '```'
            echo

            echo "## Candidate License Files"
            echo '```'
            find apk_source \
              -type f \
              \( -iname "*license*" \
              -o -iname "*authorize*" \
              -o -iname "*authorization*" \
              -o -iname "*entitlement*" \
              -o -iname "*activation*" \
              -o -iname "*securityguard*" \
              \) \
              -print
            echo '```'
            echo

            echo "## Candidate License Methods"
            echo '```'
            cat analysis/license-methods.txt 2>/dev/null || true
            echo '```'
            echo

            echo "## Network References"
            echo '```'
            cat analysis/network-references.txt 2>/dev/null || true
            echo '```'
            echo

            echo "## Storage References"
            echo '```'
            cat analysis/storage-references.txt 2>/dev/null || true
            echo '```'

          } > analysis/SUMMARY.md

          cat analysis/SUMMARY.md

      - name: Upload Analysis
        uses: actions/upload-artifact@v4
        with:
          name: ninja-license-analysis
          path: |
            analysis/**
            apk-sha256.txt
